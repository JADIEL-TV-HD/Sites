<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JADIEL IMG — Gestor</title><style>:root{--bg:#070a09;--panel:#0e1411;--line:#ffffff12;--text:#f4f7f5;--muted:#98a49e;--green:#39e58c;--red:#ff6370}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#123a28,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}.wrap{min-height:100vh;display:flex}.side{width:245px;border-right:1px solid var(--line);padding:24px;position:fixed;inset:0 auto 0 0;background:#080c0ade;backdrop-filter:blur(18px)}.brand{font-size:20px;font-weight:800}.brand span{color:var(--green)}nav{margin-top:35px;display:grid;gap:8px}nav button,.btn{border:1px solid var(--line);background:#ffffff05;color:var(--text);padding:12px 14px;border-radius:12px;text-align:left;cursor:pointer}nav button:hover,.btn:hover{border-color:#39e58c55;background:#39e58c08}.main{margin-left:245px;width:calc(100% - 245px);padding:30px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.table{background:#0d1310cc;border:1px solid var(--line);border-radius:18px;padding:20px}.card b{display:block;font-size:28px;margin-top:8px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:14px}th{color:#b9c5bf}.pill{padding:5px 9px;border-radius:999px;background:#39e58c12;color:#8ef0bc;font-size:12px}.danger{color:#ff8b94;background:#ff637012}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);padding:28px;background:#0d1310;border:1px solid var(--line);border-radius:22px}.field{margin:15px 0}.field label{display:block;color:#b9c5bf;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#070a08;color:#fff}.primary{background:linear-gradient(135deg,#39e58c,#17b86b);color:#041009;border:0;font-weight:800}.full{width:100%}@media(max-width:800px){.side{width:70px;padding:14px}.side .label,.side .brand{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid{grid-template-columns:1fr 1fr}.table{overflow:auto}th,td{white-space:nowrap}}</style></head><body><section id="login" class="login"><div class="loginbox"><div class="brand">JADIEL <span>IMG</span></div><h2>Painel do Gestor</h2><p class="muted">Área administrativa protegida.</p><form onsubmit="login(event)"><div class="field"><label>E-mail administrativo</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><button class="btn primary full">Entrar</button></form><p class="muted" style="font-size:12px;margin-top:18px">Defina ADMIN_API no armazenamento local para conectar ao backend.</p></div></section><section id="panel" class="wrap hidden"><aside class="side"><div class="brand">JADIEL <span>IMG</span></div><nav><button onclick="section('dashboard')">⌂ <span class="label">Dashboard</span></button><button onclick="section('users')">◉ <span class="label">Usuários</span></button><button onclick="section('images')">▣ <span class="label">Imagens</span></button><button onclick="section('settings')">⚙ <span class="label">Configurações</span></button><button onclick="logout()">↪ <span class="label">Sair</span></button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Controle do JADIEL IMG</div></div><button class="btn" onclick="refresh()">Atualizar</button></div><div id="view"></div></main></section><script>const API=localStorage.getItem('JADIEL_IMG_ADMIN_API')||localStorage.getItem('JADIEL_IMG_API')||'';let token=localStorage.getItem('jadiel_admin_token');const $=id=>document.getElementById(id);async function login(e){e.preventDefault();if(!API){token='demo-admin';localStorage.setItem('jadiel_admin_token',token);show();return}let r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});let d=await r.json();if(!r.ok)return alert(d.error||'Falha no login');token=d.token;localStorage.setItem('jadiel_admin_token',token);show()}function show(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');section('dashboard')}function section(s){$('title').textContent=s[0].toUpperCase()+s.slice(1);if(s==='dashboard')dashboard();if(s==='users')users();if(s==='images')images();if(s==='settings')settings()}async function api(path,opt={}){if(!API)return null;opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};let r=await fetch(API+path,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}async function dashboard(){let d=await api('/admin/stats');if(!d)d={users:0,images:0,storage:0,shares:0};$('view').innerHTML='<div class="grid">'+[['Usuários',d.users],['Imagens',d.images],['Armazenamento',format(d.storage)],['Compartilhamentos',d.shares]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h3>Visão geral</h3><p class="muted">Use o menu para administrar usuários, imagens e configurações.</p></div>'}async function users(){let d=await api('/admin/users');let a=d?.users||[];$('view').innerHTML='<div class="table"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Imagens</th><th>Ações</th></tr></thead><tbody>'+a.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td><span class="pill '+(u.status==='blocked'?'danger':'')+'">'+u.status+'</span></td><td>'+u.image_count+'</td><td><button class="btn" onclick="toggleUser(\''+u.id+'\')">'+(u.status==='blocked'?'Desbloquear':'Bloquear')+'</button></td></tr>').join('')+'</tbody></table></div>'}async function toggleUser(id){if(!API)return alert('Conecte o backend para administrar usuários.');await api('/admin/users/'+id+'/toggle',{method:'POST'});users()}async function images(){let d=await api('/admin/images');let a=d?.images||[];$('view').innerHTML='<div class="table"><table><thead><tr><th>Arquivo</th><th>Usuário</th><th>Tamanho</th><th>Data</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+format(x.size)+'</td><td>'+esc(x.created_at)+'</td></tr>').join('')+'</tbody></table></div>'}function settings(){$('view').innerHTML='<div class="card"><h3>Configurações</h3><p class="muted">Limite padrão, tamanho máximo de upload, manutenção e regras de compartilhamento devem ser persistidos no backend.</p><button class="btn primary" onclick="alert(\'Configure estas opções através da API administrativa.\')">Gerenciar configurações</button></div>'}function refresh(){section($('title').textContent.toLowerCase())}function format(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logout(){localStorage.removeItem('jadiel_admin_token');location.reload()}if(token)show()</script></body></html>

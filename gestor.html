<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JADIEL IMG — Gestor</title>
<style>
:root{--bg:#050806;--panel:#0b120e;--line:#ffffff12;--text:#f4f8f5;--muted:#8e9b94;--g:#39e58c;--g2:#15b86a;--red:#ff6674}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#164b31,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}.hidden{display:none!important}.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#0b120e;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 30px 100px #0009}.brand{font-size:21px;font-weight:900;letter-spacing:-.05em}.brand span{color:var(--g)}.field{margin:15px 0}.field label{display:block;color:#bdc8c2;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#060a07;color:#fff}.btn{border:1px solid var(--line);background:#ffffff06;color:#fff;padding:11px 14px;border-radius:12px;cursor:pointer}.btn:hover{border-color:#39e58c55}.primary{border:0;background:linear-gradient(135deg,var(--g),var(--g2));color:#041008;font-weight:850}.full{width:100%}
.layout{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:fixed;inset:0 auto 0 0;width:240px;padding:22px 14px;border-right:1px solid var(--line);background:#07100de8;backdrop-filter:blur(20px)}nav{margin-top:30px}.nav{width:100%;border:1px solid transparent;background:transparent;color:#b8c4bd;padding:12px 13px;border-radius:12px;text-align:left;cursor:pointer;margin:3px 0}.nav:hover,.nav.active{color:#fff;background:#39e58c0d;border-color:#39e58c22}.main{margin-left:240px;padding:28px;max-width:1500px;width:calc(100% - 240px)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card,.table{background:#0b130fdb;border:1px solid var(--line);border-radius:18px;padding:19px}.card strong{display:block;font-size:28px;margin-top:7px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#b9c5bf;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#39e58c12;color:#8ef0bc;font-size:12px}.pill.red{background:#ff667412;color:#ff9da6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.check{display:flex;gap:10px;align-items:center;margin:14px 0}.toast{position:fixed;right:18px;bottom:18px;background:#101a14;border:1px solid var(--line);padding:13px 16px;border-radius:12px;z-index:20}
@media(max-width:800px){.layout{grid-template-columns:70px 1fr}.side{width:70px;padding:14px 8px}.side .brand,.side span{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="login" class="login"><div class="box">
<div class="brand">JADIEL <span>IMG</span></div><h2>Painel do Gestor</h2><p class="muted">Administração do armazenamento de imagens.</p>
<form onsubmit="login(event)"><div class="field"><label>E-mail administrativo</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><div id="err" class="muted" style="color:#ff8d97;min-height:20px"></div><button class="btn primary full">Entrar</button></form>
<p class="muted" style="font-size:12px;margin-top:18px">Em produção, o acesso administrativo deve ser validado exclusivamente pela API. O frontend nunca concede privilégios.</p>
</div></section>
<section id="panel" class="layout hidden">
<aside class="side"><div class="brand">JADIEL <span>IMG</span></div><nav>
<button class="nav active" data-s="dashboard" onclick="section('dashboard')">⌂ <span>Dashboard</span></button>
<button class="nav" data-s="users" onclick="section('users')">◉ <span>Usuários</span></button>
<button class="nav" data-s="images" onclick="section('images')">▣ <span>Imagens</span></button>
<button class="nav" data-s="limits" onclick="section('limits')">◫ <span>Limites e planos</span></button>
<button class="nav" data-s="notifications" onclick="section('notifications')">◌ <span>Notificações</span></button>
<button class="nav" data-s="logs" onclick="section('logs')">≡ <span>Logs</span></button>
<button class="nav" data-s="settings" onclick="section('settings')">⚙ <span>Configurações</span></button>
<button class="nav" onclick="logout()">↪ <span>Sair</span></button>
</nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Controle central do JADIEL IMG</div></div><button class="btn" onclick="section(current)">Atualizar</button></div><div id="view"></div></main>
</section><div id="toast" class="toast hidden"></div>
<script>
const API=localStorage.getItem('JADIEL_IMG_ADMIN_API')||localStorage.getItem('JADIEL_IMG_API')||'';let token=localStorage.getItem('jadiel_admin_token'),current='dashboard';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
async function login(e){e.preventDefault();$('err').textContent='';if(!API){$('err').textContent='Configure a URL da API administrativa antes de entrar.';return}try{const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha no login');token=d.token;localStorage.setItem('jadiel_admin_token',token);show()}catch(x){$('err').textContent=x.message}}
function show(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');section('dashboard')}
async function api(path,opt={}){if(!API)return null;opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(API+path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Erro na API');return d}
function section(s){current=s;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.s===s));$('title').textContent={dashboard:'Dashboard',users:'Usuários',images:'Imagens',limits:'Limites e planos',notifications:'Notificações',logs:'Logs administrativos',settings:'Configurações'}[s]||s;({dashboard,users,images,limits,notifications,logs,settings}[s])()}
async function dashboard(){const d=await api('/admin/stats')||{users:0,images:0,storage:0,shares:0};$('view').innerHTML='<div class="cards">'+[['Usuários',d.users],['Imagens',d.images],['Armazenamento',fmt(d.storage)],['Compartilhamentos',d.shares]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="grid2"><div class="card"><h3>Estado do serviço</h3><p><span class="pill">ONLINE</span></p><p class="muted">A API deve aplicar autenticação, autorização, limites e validação de arquivos no servidor.</p></div><div class="card"><h3>Segurança</h3><p class="muted">Senhas com hash forte, HTTPS, rate limiting, validação MIME, isolamento por usuário e armazenamento privado.</p></div></div>'}
async function users(){const d=await api('/admin/users');const a=d?.users||[];$('view').innerHTML='<div class="table"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Imagens</th><th>Armazenamento</th><th>Ação</th></tr></thead><tbody>'+a.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td><span class="pill '+(u.status==='blocked'?'red':'')+'">'+esc(u.status)+'</span></td><td>'+u.image_count+'</td><td>'+fmt(u.storage_used)+'</td><td><button class="btn" onclick="toggleUser(\''+u.id+'\')">'+(u.status==='blocked'?'Desbloquear':'Bloquear')+'</button></td></tr>').join('')+'</tbody></table></div>'}
async function toggleUser(id){if(!API)return toast('API administrativa não configurada.');await api('/admin/users/'+id+'/toggle',{method:'POST'});toast('Status atualizado.');users()}
async function images(){const d=await api('/admin/images');const a=d?.images||[];$('view').innerHTML='<div class="table"><table><thead><tr><th>Arquivo</th><th>Usuário</th><th>Tamanho</th><th>Data</th><th>Ação</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+fmt(x.size)+'</td><td>'+esc(x.created_at)+'</td><td><button class="btn" onclick="deleteImage(\''+x.id+'\')">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}
async function deleteImage(id){if(!API||!confirm('Excluir esta imagem?'))return;await api('/admin/images/'+id,{method:'DELETE'});images()}
function limits(){$('view').innerHTML='<div class="grid2"><div class="card"><h3>Limite padrão</h3><div class="field"><label>Armazenamento por usuário (GB)</label><input id="limit" type="number" min="1" value="5"></div><div class="field"><label>Tamanho máximo por imagem (MB)</label><input id="max" type="number" min="1" value="25"></div><button class="btn primary" onclick="saveSettings()">Salvar limites</button></div><div class="card"><h3>Planos</h3><p class="muted">A estrutura permite criar planos gratuitos e pagos posteriormente. A cobrança deve ser validada pelo backend.</p><button class="btn" onclick="toast('Estrutura preparada para planos.')">Ver planos</button></div></div>'}
function notifications(){$('view').innerHTML='<div class="card"><h3>Enviar notificação</h3><div class="field"><label>Título</label><input id="nt" placeholder="Aviso importante"></div><div class="field"><label>Mensagem</label><input id="nm" placeholder="Digite a mensagem"></div><button class="btn primary" onclick="sendNotification()">Enviar para usuários</button></div>'}
async function sendNotification(){if(!API)return toast('Conecte a API para enviar notificações.');await api('/admin/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('nt').value,message:$('nm').value})});toast('Notificação enviada.')}
async function logs(){const d=await api('/admin/logs');const a=d?.logs||[];$('view').innerHTML='<div class="table"><table><thead><tr><th>Data</th><th>Ação</th><th>Alvo</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.created_at)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.target_id||'-')+'</td></tr>').join('')+'</tbody></table></div>'}
function settings(){$('view').innerHTML='<div class="card"><h3>Configurações gerais</h3><label class="check"><input id="maintenance" type="checkbox"> Modo manutenção</label><label class="check"><input id="registration" type="checkbox" checked> Permitir novos cadastros</label><label class="check"><input id="sharing" type="checkbox" checked> Permitir compartilhamento</label><button class="btn primary" onclick="saveSettings()">Salvar configurações</button></div>'}
async function saveSettings(){if(!API)return toast('Conecte a API para persistir configurações.');await api('/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({maintenance:$('maintenance')?.checked||false,registration:$('registration')?.checked!==false,sharing:$('sharing')?.checked!==false,storage_limit_gb:Number($('limit')?.value||5),max_image_mb:Number($('max')?.value||25)})});toast('Configurações salvas.')}
function fmt(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function logout(){localStorage.removeItem('jadiel_admin_token');location.reload()}
if(token)show();
</script>
</body></html>
